          let a = sprawdz[1];
          let b = sprawdz[2];
          let wzorr = sprawdz[0];
          let x0 = (-b/a);

          
          
          let tak = document.getElementById("bruh").innerHTML= a;
          let nie = document.getElementById("sruh").innerHTML= b;
          let dupa = document.getElementById("muh").innerHTML= wzorr;
          let ehh = document.getElementById("guh").innerHTML= -(b) + "/" + a + " = " + x0;


        }
      </script>
      <div id="bruh"></div>
      <div id="sruh"></div>
      <div id="muh"></div>
      <div id="guh"></div>
      
  </body>
